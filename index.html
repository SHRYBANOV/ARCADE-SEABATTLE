<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#143d42">
  <title>Морской Бой - Советский Игровой Автомат</title>
  <style>
    * { 
      margin: 0; padding: 0; box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; user-select: none;
      touch-action: none;
    }
    
    body {
      background: #081719; font-family: 'Courier New', monospace; color: #a3ffdf;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* Верхнее табло автомата */
    .top-bar {
      display: flex; justify-content: space-between; padding: 10px 20px;
      border-bottom: 2px solid #2e7e80; background: #0b2224; z-index: 10;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .top-bar div { font-size: 1.1rem; font-weight: bold; color: #a3ffdf; text-shadow: 0 0 6px #2e7e80; }

    /* Оптический блок перископа */
    .game-container {
      flex-grow: 1; display: flex; justify-content: center; align-items: center;
      position: relative; overflow: hidden; background: #0e2b2e;
    }

    /* Затенение линзы перископа */
    .periscope-mask {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, transparent 48%, rgba(2, 10, 11, 0.94) 75%);
      pointer-events: none; z-index: 5;
    }

    /* Визирное стекло с прицельной сеткой */
    .crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 100%; height: 100%; pointer-events: none; z-index: 6;
    }
    .crosshair::before { content:''; position:absolute; top:48%; left:10%; width:80%; height:1px; background:rgba(10, 20, 20, 0.6); }
    .crosshair::after { content:''; position:absolute; left:50%; top:10%; width:1px; height:80%; background:rgba(10, 20, 20, 0.6); }
    
    .crosshair-ticks {
      position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%);
      width: 200px; height: 12px; pointer-events: none;
      border-left: 2px solid rgba(10, 20, 20, 0.7); border-right: 2px solid rgba(10, 20, 20, 0.7); z-index: 6;
    }
    .crosshair-ticks::before { content:''; position:absolute; left:33%; top:0; width:1px; height:6px; background:rgba(10, 20, 20, 0.7); }
    .crosshair-ticks::after { content:''; position:absolute; right:33%; top:0; width:1px; height:6px; background:rgba(10, 20, 20, 0.7); }

    canvas { width: 100%; height: 100%; object-fit: cover; }

    /* Панель управления автомата */
    .control-panel {
      height: 110px; background: #0a1e20; border-top: 2px solid #2e7e80;
      display: flex; justify-content: space-around; align-items: center; padding: 10px; z-index: 10;
    }

    .btn {
      width: 75px; height: 75px; border-radius: 50%;
      background: #123538; border: 3px solid #2e7e80; color: #a3ffdf;
      font-size: 1.8rem; display: flex; justify-content: center; align-items: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.5), inset 0 0 10px rgba(163,255,223,0.1);
    }
    .btn.active-btn { background: #2e7e80; color: #fff; }
    
    .btn-fire {
      width: 90px; height: 90px; border-color: #d64028; color: #ff6b4a;
      box-shadow: 0 0 15px rgba(214,64,40,0.3), inset 0 0 15px rgba(214,64,40,0.2);
    }
    .btn-fire.active-btn { background: #d64028; color: #fff; }

    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(8, 23, 25, 0.92); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 20;
    }
    .overlay h1 { font-size: 2.2rem; text-align: center; margin-bottom: 25px; color: #a3ffdf; text-shadow: 0 0 12px #2e7e80; letter-spacing: 3px; }
    .start-btn { padding: 15px 40px; font-size: 1.2rem; background: rgba(46,126,128,0.2); border: 2px solid #a3ffdf; color: #a3ffdf; font-family: inherit; font-weight: bold; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 15px rgba(46,126,128,0.3); }
    .start-btn:active { background: #a3ffdf; color: #081719; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div id="scoreDisplay">ОЧКИ: 0</div>
    <div id="torpedoDisplay">ТОРПЕДЫ: 10</div>
  </div>

  <div class="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="periscope-mask"></div>
    <div class="crosshair"></div>
    <div class="crosshair-ticks"></div>
    
    <div id="startOverlay" class="overlay">
      <h1>МОРСКОЙ БОЙ</h1>
      <button class="start-btn" onclick="startGame()">БОЕВАЯ ТРЕВОГА</button>
    </div>
  </div>

  <div class="control-panel">
    <div class="btn" id="btnLeft">◀</div>
    <div class="btn btn-fire" id="btnFire">ОГОНЬ</div>
    <div class="btn" id="btnRight">▶</div>
  </div>

  <script>
    // ─── АУТЕНТИЧНЫЙ ЗВУКОВОЙ ДВИЖОК ───
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.noiseBuffer = null;
        this.torpedoTimer = null;
      }

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          this._createNoiseBuffer();
        }
      }

      _createNoiseBuffer() {
        const bufferSize = this.ctx.sampleRate * 2;
        this.noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = this.noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }
      }

      playStartJingle() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        
        const siren = this.ctx.createOscillator();
        const sirenGain = this.ctx.createGain();
        siren.type = 'sawtooth';
        siren.frequency.setValueAtTime(280, now);
        siren.frequency.linearRampToValueAtTime(650, now + 0.35);
        siren.frequency.linearRampToValueAtTime(280, now + 0.7);
        sirenGain.gain.setValueAtTime(0.12, now);
        sirenGain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);
        siren.connect(sirenGain);
        sirenGain.connect(this.ctx.destination);
        siren.start(now);
        siren.stop(now + 0.75);

        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.08, now + 0.7 + i * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8 + i * 0.09);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + 0.7 + i * 0.09);
          osc.stop(now + 0.8 + i * 0.09);
        });
      }

      startTorpedoSound() {
        if (!this.ctx) return;
        this.stopTorpedoSound();

        let step = 0;
        this.torpedoTimer = setInterval(() => {
          if (!this.ctx) return;
          step++;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          
          osc.type = 'square';
          const pitch = 320 + step * 14;
          osc.frequency.setValueAtTime(pitch, now);
          
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.05);
        }, 100 - Math.min(step * 2, 45));
      }

      stopTorpedoSound() {
        if (this.torpedoTimer) {
          clearInterval(this.torpedoTimer);
          this.torpedoTimer = null;
        }
      }

      playExplosion() {
        if (!this.ctx) return;
        this.stopTorpedoSound();
        const now = this.ctx.currentTime;

        const noise = this.ctx.createBufferSource();
        noise.buffer = this.noiseBuffer;
        
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1000, now);
        filter.frequency.exponentialRampToValueAtTime(25, now + 1.1);

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.7, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 1.1);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(this.ctx.destination);

        const sub = this.ctx.createOscillator();
        const subGain = this.ctx.createGain();
        sub.type = 'triangle';
        sub.frequency.setValueAtTime(120, now);
        sub.frequency.exponentialRampToValueAtTime(20, now + 0.8);

        subGain.gain.setValueAtTime(0.8, now);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

        sub.connect(subGain);
        subGain.connect(this.ctx.destination);

        noise.start(now);
        sub.start(now);
        noise.stop(now + 1.1);
        sub.stop(now + 0.8);

        if (navigator.vibrate) navigator.vibrate([100, 50, 200, 50, 150]);
      }

      playSplash() {
        if (!this.ctx) return;
        this.stopTorpedoSound();
        const now = this.ctx.currentTime;
        const noise = this.ctx.createBufferSource();
        noise.buffer = this.noiseBuffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(500, now);
        filter.frequency.linearRampToValueAtTime(180, now + 0.4);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
        noise.stop(now + 0.4);
      }

      playMotor() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 50;
        gain.gain.value = 0.03;
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        setTimeout(() => osc.stop(), 90);
      }
    }

    const sound = new SoundEngine();

    // ─── ДВИЖОК ДИОРАМЫ (CANVAS) ───
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let w, h;
    let cameraX = 0; 
    let turnSpeed = 0;
    
    let state = 'menu'; 
    let score = 0;
    let torpedoes = 10;
    let HORIZON_Y = 0;
    
    let ships = [];
    let activeTorpedo = null;
    let explosions = [];

    const SHIP_TYPES = [
      { type: 'submarine', width: 70, speedBase: 2.2, points: 30 },
      { type: 'destroyer', width: 120, speedBase: 1.5, points: 20 },
      { type: 'cargo', width: 150, speedBase: 1.0, points: 15 },
      { type: 'battleship', width: 190, speedBase: 0.7, points: 10 }
    ];

    function resize() {
      w = canvas.width = canvas.parentElement.clientWidth;
      h = canvas.height = canvas.parentElement.clientHeight;
      HORIZON_Y = h * 0.48;
    }
    window.addEventListener('resize', resize);

    // Функция отрисовки закрашенного полигона
    function drawPoly(pts) {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    // ─── ЧЕТКИЕ БЕЗБАГОВЫЕ ЧЕРТЕЖИ КОРАБЛЕЙ ───
    class Ship {
      constructor() {
        let template = SHIP_TYPES[Math.floor(Math.random() * SHIP_TYPES.length)];
        this.type = template.type;
        this.width = template.width;
        this.points = template.points;
        this.direction = Math.random() > 0.5 ? 1 : -1;
        this.speed = (template.speedBase + Math.random() * 0.3) * this.direction;
        
        this.x = this.direction === 1 ? cameraX - w/2 - 250 : cameraX + w/2 + 250;
        this.y = HORIZON_Y;
        this.active = true;
        this.wakeFrame = 0;
      }

      update() {
        this.x += this.speed;
        this.wakeFrame += 0.08;
        if (Math.abs(this.x - cameraX) > w + 500) this.active = false;
      }

      draw() {
        const sx = this.x - cameraX + w/2;
        const sy = this.y;
        const hw = this.width / 2;

        ctx.save();
        
        // Переносим систему координат в центр корабля на ватерлинию
        ctx.translate(sx, sy);
        // Зеркально отражаем по X, если корабль плывет влево (direction = -1)
        ctx.scale(this.direction, 1);

        // 1. Пенная волна за кормой
        ctx.strokeStyle = 'rgba(180, 240, 230, 0.45)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(-hw, 1);
        ctx.lineTo(-hw - hw * 0.7, 3 + Math.sin(this.wakeFrame) * 1.2);
        ctx.stroke();

        // Бурун у носа
        ctx.beginPath();
        ctx.moveTo(hw, 1);
        ctx.lineTo(hw - 10, 3);
        ctx.stroke();

        // 2. Силуэт корабля (Все детали рисуются СТРОГО СПРАВА НАЛЕВО, смотреть ВПРАВО)
        ctx.fillStyle = '#0a1618';
        ctx.strokeStyle = '#020607';
        ctx.lineWidth = 1;

        if (this.type === 'submarine') {
          // ПОДВОДНАЯ ЛОДКА
          drawPoly([
            [-hw, 0],
            [-hw + 8, -4],
            [0, -7],
            [hw - 8, -4],
            [hw, 0]
          ]);
          ctx.fillRect(-8, -13, 16, 7); // Рубка
          ctx.fillRect(2, -21, 2, 9);   // Перископ
        } 
        else if (this.type === 'destroyer') {
          // ЭСМИНЕЦ
          drawPoly([
            [-hw, 0],
            [-hw + 6, -8],
            [hw - 12, -10],
            [hw, 0]
          ]);
          // Мостик
          ctx.fillRect(-10, -19, 20, 10);
          ctx.fillRect(-4, -26, 10, 7);
          // Мачта / Радар
          ctx.fillRect(0, -37, 2, 11);
          ctx.fillRect(-5, -34, 10, 2);
          // Скошенная труба
          drawPoly([[-22, -9], [-19, -20], [-11, -20], [-14, -9]]);
          // Носовое орудие (смотрит вправо)
          ctx.fillRect(22, -15, 12, 5);
          ctx.fillRect(34, -13, 12, 2); // Ствол
          // Кормовое орудие (смотрит влево)
          ctx.fillRect(-32, -14, 12, 5);
          ctx.fillRect(-42, -12, 10, 2);
        }
        else if (this.type === 'cargo') {
          // ТРАНСПОРТ / ТАНКЕР
          drawPoly([
            [-hw, 0],
            [-hw + 6, -11],
            [hw - 10, -11],
            [hw, 0]
          ]);
          // Носовой бак
          ctx.fillRect(hw - 22, -16, 18, 5);
          // Кормовая надстройка
          const aftX = -hw + 14;
          ctx.fillRect(aftX, -25, 24, 14);
          ctx.fillRect(aftX + 8, -35, 8, 10); // Труба
          // Мачты и крановые стрелы
          ctx.fillRect(10, -31, 2, 20);
          ctx.beginPath(); ctx.moveTo(10, -25); ctx.lineTo(24, -16); ctx.stroke();
          ctx.fillRect(-20, -31, 2, 20);
          ctx.beginPath(); ctx.moveTo(-20, -25); ctx.lineTo(-34, -16); ctx.stroke();
        }
        else if (this.type === 'battleship') {
          // ЛИНКОР
          drawPoly([
            [-hw, 0],
            [-hw + 10, -12],
            [hw - 16, -14],
            [hw, 0]
          ]);
          // Главный броневой массив / Мостик
          ctx.fillRect(-25, -25, 50, 12);
          ctx.fillRect(-15, -38, 30, 13);
          ctx.fillRect(-8, -50, 16, 12);
          // Мачта дальномера
          ctx.fillRect(-1, -62, 2, 12);
          ctx.fillRect(-7, -59, 14, 2);
          // Две наклоненные трубы
          drawPoly([[-24, -25], [-21, -35], [-15, -35], [-18, -25]]);
          drawPoly([[-36, -25], [-33, -33], [-27, -33], [-30, -25]]);

          // Башни главного калибра (Носовая верхняя)
          ctx.fillRect(15, -21, 18, 7);
          ctx.fillRect(33, -19, 20, 2); // Стволы ГК

          // Носовая нижняя башня
          ctx.fillRect(45, -19, 18, 6);
          ctx.fillRect(63, -17, 20, 2);

          // Кормовая башня ГК (смотрит назад)
          ctx.fillRect(-55, -19, 18, 6);
          ctx.fillRect(-75, -17, 20, 2);
        }

        ctx.restore();
      }
    }

    // ─── ИМИТАЦИЯ ЦЕПОЧКИ ЛАМПОЧЕК ТОРПЕДЫ ───
    class Torpedo {
      constructor() {
        this.x = cameraX; 
        this.y = h;
        this.speedY = 5.0;
        this.active = true;
        this.bulbs = []; 
      }

      update() {
        this.y -= this.speedY;
        
        this.bulbs.push({ x: this.x, y: this.y, alpha: 1.0 });
        this.bulbs.forEach(b => b.alpha -= 0.04);
        this.bulbs = this.bulbs.filter(b => b.alpha > 0);

        if (this.y <= HORIZON_Y + 3) {
          this.checkCollision();
          this.active = false;
          activeTorpedo = null;
        }
      }

      checkCollision() {
        let hit = false;
        ships.forEach(ship => {
          if (ship.active && Math.abs(this.x - ship.x) < ship.width / 2) {
            ship.active = false;
            hit = true;
            score += ship.points;
            document.getElementById('scoreDisplay').innerText = `ОЧКИ: ${score}`;
            sound.playExplosion();
            explosions.push({ x: ship.x, y: ship.y, radius: 10, life: 1.0 });
          }
        });

        if (!hit) {
          sound.playSplash();
          explosions.push({ x: this.x, y: HORIZON_Y, radius: 5, life: 0.6, splash: true });
        }
      }

      draw() {
        this.bulbs.forEach(b => {
          const sx = b.x - cameraX + w/2;
          ctx.save();
          ctx.fillStyle = `rgba(255, 170, 0, ${b.alpha})`;
          ctx.shadowBlur = 12 * b.alpha;
          ctx.shadowColor = '#ff8800';
          ctx.beginPath();
          ctx.arc(sx, b.y, 3.5 * b.alpha + 1, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
      }
    }

    function startGame() {
      resize();
      sound.init();
      sound.playStartJingle();

      document.getElementById('startOverlay').style.display = 'none';
      score = 0; torpedoes = 10; cameraX = 1500;
      ships = []; explosions = []; activeTorpedo = null;
      state = 'playing';
      updateUI();
      gameLoop();
    }

    function updateUI() {
      document.getElementById('scoreDisplay').innerText = `ОЧКИ: ${score}`;
      document.getElementById('torpedoDisplay').innerText = `ТОРПЕДЫ: ${torpedoes}`;
    }

    function fire() {
      if (state !== 'playing' || activeTorpedo || torpedoes <= 0) return;
      torpedoes--;
      updateUI();
      
      sound.startTorpedoSound();
      activeTorpedo = new Torpedo();
      
      document.getElementById('btnFire').classList.add('active-btn');
      setTimeout(() => document.getElementById('btnFire').classList.remove('active-btn'), 180);

      if (torpedoes <= 0) {
        setTimeout(() => {
          state = 'gameover';
          document.getElementById('startOverlay').style.display = 'flex';
          document.getElementById('startOverlay').innerHTML = `
            <h1>ИГРА ОКОНЧЕНА<br><br><span style="font-size:1.5rem; color:#ffaa00">ОЧКИ: ${score}</span></h1>
            <button class="start-btn" onclick="startGame()">СЫГРАТЬ ЕЩЕ</button>
          `;
        }, 2600); 
      }
    }

    // ─── УПРАВЛЕНИЕ ───
    const btnL = document.getElementById('btnLeft');
    const btnR = document.getElementById('btnRight');
    const btnF = document.getElementById('btnFire');

    btnL.addEventListener('pointerdown', () => { turnSpeed = -4; btnL.classList.add('active-btn'); });
    btnL.addEventListener('pointerup', () => { turnSpeed = 0; btnL.classList.remove('active-btn'); });
    btnL.addEventListener('pointerleave', () => { turnSpeed = 0; btnL.classList.remove('active-btn'); });
    
    btnR.addEventListener('pointerdown', () => { turnSpeed = 4; btnR.classList.add('active-btn'); });
    btnR.addEventListener('pointerup', () => { turnSpeed = 0; btnR.classList.remove('active-btn'); });
    btnR.addEventListener('pointerleave', () => { turnSpeed = 0; btnR.classList.remove('active-btn'); });
    
    btnF.addEventListener('pointerdown', fire);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') { turnSpeed = -4; btnL.classList.add('active-btn'); }
      if (e.key === 'ArrowRight' || e.key === 'd') { turnSpeed = 4; btnR.classList.add('active-btn'); }
      if (e.key === ' ' || e.key === 'Enter') fire();
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') { turnSpeed = 0; btnL.classList.remove('active-btn'); }
      if (e.key === 'ArrowRight' || e.key === 'd') { turnSpeed = 0; btnR.classList.remove('active-btn'); }
    });

    function wrap(val, max) { return ((val % max) + max) % max; }

    // ─── ОТРИСОВКА ОРИГИНАЛЬНОЙ ДИОРАМЫ ───
    function gameLoop() {
      if (state !== 'playing' && !activeTorpedo && explosions.length === 0) return;
      requestAnimationFrame(gameLoop);
      
      cameraX += turnSpeed;
      if (turnSpeed !== 0 && Math.random() > 0.8) sound.playMotor(); 

      if (Math.random() < 0.015 && ships.length < 4) ships.push(new Ship());

      ships.forEach(s => s.update());
      ships = ships.filter(s => s.active);
      if (activeTorpedo) activeTorpedo.update();

      // 1. Бирюзовое небо с облаками
      let skyGrad = ctx.createLinearGradient(0, 0, 0, HORIZON_Y);
      skyGrad.addColorStop(0, '#2e6b72');
      skyGrad.addColorStop(0.7, '#4e9297');
      skyGrad.addColorStop(1, '#6bb2b5');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, HORIZON_Y);

      // Облака
      ctx.fillStyle = 'rgba(215, 245, 240, 0.25)';
      ctx.beginPath();
      let cloudX1 = wrap(500 - cameraX * 0.1, 2000) - 200;
      ctx.arc(cloudX1, 40, 60, 0, Math.PI*2);
      ctx.arc(cloudX1 + 50, 35, 45, 0, Math.PI*2);
      ctx.arc(cloudX1 - 50, 45, 40, 0, Math.PI*2);
      
      let cloudX2 = wrap(1400 - cameraX * 0.1, 2000) - 200;
      ctx.arc(cloudX2, 60, 80, 0, Math.PI*2);
      ctx.arc(cloudX2 + 70, 50, 55, 0, Math.PI*2);
      ctx.fill();

      // Световое табло «ИГРА»
      ctx.save();
      ctx.font = 'bold 16px "Courier New", monospace';
      ctx.fillStyle = 'rgba(235, 255, 250, 0.85)';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText('И Г Р А', w / 2, 35);
      ctx.restore();

      // 2. Скалы по бокам
      ctx.fillStyle = '#7a3e1d';
      ctx.strokeStyle = '#4a2510';
      ctx.lineWidth = 1.5;

      // Скала СЛЕВА
      let rockLeftX = wrap(100 - cameraX * 0.35, 2400) - 300;
      drawPoly([
        [rockLeftX - 100, HORIZON_Y],
        [rockLeftX + 40, HORIZON_Y - 110],
        [rockLeftX + 90, HORIZON_Y - 70],
        [rockLeftX + 150, HORIZON_Y - 140],
        [rockLeftX + 220, HORIZON_Y]
      ]);

      // Скала СПРАВА
      let rockRightX = wrap(1700 - cameraX * 0.35, 2400) - 300;
      drawPoly([
        [rockRightX, HORIZON_Y],
        [rockRightX + 80, HORIZON_Y - 130],
        [rockRightX + 140, HORIZON_Y - 80],
        [rockRightX + 210, HORIZON_Y - 160],
        [rockRightX + 320, HORIZON_Y]
      ]);

      // 3. Бирюзовое море
      let seaGrad = ctx.createLinearGradient(0, HORIZON_Y, 0, h);
      seaGrad.addColorStop(0, '#2b6f72');
      seaGrad.addColorStop(0.4, '#1b5053');
      seaGrad.addColorStop(1, '#0c2d30');
      ctx.fillStyle = seaGrad;
      ctx.fillRect(0, HORIZON_Y, w, h - HORIZON_Y);

      // Волны
      ctx.strokeStyle = 'rgba(120, 200, 195, 0.25)';
      ctx.lineWidth = 1;
      for (let y = HORIZON_Y + 8; y < h; y += 12) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      // Линия горизонта
      ctx.strokeStyle = 'rgba(160, 230, 220, 0.6)';
      ctx.beginPath(); ctx.moveTo(0, HORIZON_Y); ctx.lineTo(w, HORIZON_Y); ctx.stroke();

      // 4. Корабли
      ships.forEach(s => s.draw());
      
      // Торпеда
      if (activeTorpedo) activeTorpedo.draw();

      // Взрывы
      explosions.forEach(exp => {
        const sx = exp.x - cameraX + w/2;
        ctx.save();
        ctx.beginPath();
        ctx.arc(sx, exp.y - 6, exp.radius * 2, 0, Math.PI * 2);
        
        if (exp.splash) {
          ctx.fillStyle = `rgba(180, 240, 230, ${exp.life * 0.7})`;
          ctx.fill();
        } else {
          ctx.fillStyle = `rgba(255, 60, 20, ${exp.life})`;
          ctx.shadowBlur = 30; 
          ctx.shadowColor = '#ff2200';
          ctx.fill();
        }
        
        ctx.restore();
        exp.radius += exp.splash ? 0.5 : 1.2;
        exp.life -= 0.03;
      });
      explosions = explosions.filter(e => e.life > 0);
    }
  </script>
</body>
</html>
