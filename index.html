<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#020813">
  <title>Морской Бой - Симулятор</title>
  <style>
    * { 
      margin: 0; padding: 0; box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; user-select: none;
      touch-action: none;
    }
    
    body {
      background: #020813; font-family: 'Courier New', monospace; color: #00ff41;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* Эффект старого экрана (сканлайны) */
    body::after {
      content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(0deg, rgba(0,255,65,0.04) 0px, rgba(0,255,65,0.04) 1px, transparent 1px, transparent 3px);
      pointer-events: none; z-index: 100;
    }

    .top-bar {
      display: flex; justify-content: space-between; padding: 12px 25px;
      border-bottom: 2px solid #00ff41; background: #01060a; z-index: 10;
      box-shadow: 0 4px 15px rgba(0,255,65,0.1);
    }
    .top-bar div { font-size: 1.2rem; font-weight: bold; text-shadow: 0 0 8px #00ff41; }

    .game-container {
      flex-grow: 1; display: flex; justify-content: center; align-items: center;
      position: relative; overflow: hidden; background: #020a14;
    }

    /* Затенение по краям перископа */
    .periscope-mask {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.95) 75%);
      pointer-events: none; z-index: 5;
    }

    /* Сетка оптического прицела */
    .crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 100%; height: 100%; pointer-events: none; z-index: 6;
    }
    .crosshair::before { content:''; position:absolute; top:45%; left:15%; width:70%; height:1px; background:rgba(0,255,65,0.4); }
    .crosshair::after { content:''; position:absolute; left:50%; top:15%; width:1px; height:70%; background:rgba(0,255,65,0.4); }
    
    .crosshair-ticks {
      position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
      width: 180px; height: 12px; pointer-events: none;
      border-left: 2px solid rgba(0,255,65,0.6); border-right: 2px solid rgba(0,255,65,0.6); z-index: 6;
    }
    .crosshair-ticks::before { content:''; position:absolute; left:33%; top:0; width:1px; height:6px; background:rgba(0,255,65,0.6); }
    .crosshair-ticks::after { content:''; position:absolute; right:33%; top:0; width:1px; height:6px; background:rgba(0,255,65,0.6); }

    canvas { width: 100%; height: 100%; object-fit: cover; }

    .control-panel {
      height: 120px; background: #01060a; border-top: 2px solid #00ff41;
      display: flex; justify-content: space-around; align-items: center; padding: 10px; z-index: 10;
    }

    .btn {
      width: 80px; height: 80px; border-radius: 50%;
      background: #051018; border: 3px solid #00ff41; color: #00ff41;
      font-size: 2rem; display: flex; justify-content: center; align-items: center;
      box-shadow: 0 0 15px rgba(0,255,65,0.15), inset 0 0 10px rgba(0,255,65,0.1);
      transition: background 0.1s;
    }
    .btn.active-btn { background: #00ff41; color: #000; box-shadow: 0 0 20px #00ff41; }
    
    .btn-fire {
      width: 100px; height: 100px; border-color: #ff3c00; color: #ff3c00;
      box-shadow: 0 0 20px rgba(255,60,0,0.2), inset 0 0 15px rgba(255,60,0,0.2);
    }
    .btn-fire.active-btn { background: #ff3c00; color: #fff; box-shadow: 0 0 30px #ff3c00; }

    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 8, 19, 0.9); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 20;
    }
    .overlay h1 { font-size: 2.2rem; text-align: center; margin-bottom: 30px; text-shadow: 0 0 15px #00ff41; letter-spacing: 2px; }
    .start-btn { padding: 15px 40px; font-size: 1.2rem; background: rgba(0,255,65,0.1); border: 2px solid #00ff41; color: #00ff41; font-family: inherit; font-weight: bold; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 15px rgba(0,255,65,0.2); }
    .start-btn:active { background: #00ff41; color: #000; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div id="scoreDisplay">ОЧКИ: 0</div>
    <div id="torpedoDisplay">ТОРПЕДЫ: 10</div>
  </div>

  <div class="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="periscope-mask"></div>
    <div class="crosshair"></div>
    <div class="crosshair-ticks"></div>
    
    <div id="startOverlay" class="overlay">
      <h1>МОРСКОЙ БОЙ</h1>
      <button class="start-btn" onclick="startGame()">БОЕВАЯ ТРЕВОГА</button>
    </div>
  </div>

  <div class="control-panel">
    <div class="btn" id="btnLeft">◀</div>
    <div class="btn btn-fire" id="btnFire">ОГОНЬ</div>
    <div class="btn" id="btnRight">▶</div>
  </div>

  <script>
    // --- ЗВУКОВОЙ ДВИЖОК ---
    class SoundEngine {
      constructor() { this.ctx = null; }
      init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      play(type) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.connect(gain); gain.connect(this.ctx.destination);
        
        if (type === 'launch') { 
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 1.2);
          gain.gain.setValueAtTime(0.4, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 1.2);
          osc.start(); osc.stop(this.ctx.currentTime + 1.2);
        } else if (type === 'boom') { 
          osc.type = 'square'; osc.frequency.setValueAtTime(100, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.8);
          gain.gain.setValueAtTime(0.6, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.8);
          osc.start(); osc.stop(this.ctx.currentTime + 0.8);
        } else if (type === 'motor') { 
          osc.type = 'sine'; osc.frequency.value = 50;
          gain.gain.value = 0.05; osc.start();
          setTimeout(()=> { osc.stop(); }, 100);
        }
        if (navigator.vibrate) {
          if (type === 'launch') navigator.vibrate(50);
          if (type === 'boom') navigator.vibrate([100, 50, 200, 50, 300]);
        }
      }
    }
    const sound = new SoundEngine();

    // --- ДВИЖОК ИГРЫ (CANVAS) ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let w, h;
    let cameraX = 0; 
    let turnSpeed = 0;
    
    let state = 'menu'; 
    let score = 0;
    let torpedoes = 10;
    let HORIZON_Y = 0;
    
    let ships = [];
    let activeTorpedo = null;
    let explosions = [];
    let stars = [];
    let mountains = [];

    // Характеристики кораблей
    const SHIP_TYPES = [
      { type: 'submarine', width: 60, speedBase: 2.5, points: 30, yOffset: 2 },
      { type: 'destroyer', width: 110, speedBase: 1.5, points: 20, yOffset: 0 },
      { type: 'battleship', width: 180, speedBase: 0.8, points: 10, yOffset: -5 }
    ];

    function resize() {
      w = canvas.width = canvas.parentElement.clientWidth;
      h = canvas.height = canvas.parentElement.clientHeight;
      HORIZON_Y = h * 0.45;
      generateBackground();
    }
    window.addEventListener('resize', resize);
    
    // Генерация статического мира (для параллакса)
    function generateBackground() {
      stars = []; mountains = [];
      for(let i=0; i<80; i++) {
        stars.push({ x: Math.random() * 3000, y: Math.random() * HORIZON_Y, size: Math.random() * 1.5 });
      }
      let mx = 0;
      while (mx < 3000) {
        let mWidth = 100 + Math.random() * 200;
        let mHeight = 20 + Math.random() * 40;
        mountains.push({ x: mx, w: mWidth, h: mHeight });
        mx += mWidth * 0.8; 
      }
    }

    class Ship {
      constructor() {
        let template = SHIP_TYPES[Math.floor(Math.random() * SHIP_TYPES.length)];
        this.type = template.type;
        this.width = template.width;
        this.points = template.points;
        this.direction = Math.random() > 0.5 ? 1 : -1;
        this.speed = (template.speedBase + Math.random() * 0.5) * this.direction;
        
        // Появляются за экраном
        this.x = this.direction === 1 ? cameraX - w/2 - 200 : cameraX + w/2 + 200;
        this.y = HORIZON_Y + template.yOffset;
        this.active = true;
      }
      update() {
        this.x += this.speed;
        if (Math.abs(this.x - cameraX) > w + 400) this.active = false;
      }
      draw() {
        const screenX = this.x - cameraX + w/2;
        
        ctx.fillStyle = '#010a05'; // Темная заливка внутри
        ctx.strokeStyle = '#00ff41'; // Неоновый контур
        ctx.lineWidth = 1.5;
        
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#00ff41';

        ctx.beginPath();
        
        if (this.type === 'submarine') {
          // Подлодка
          ctx.ellipse(screenX, this.y, this.width/2, 8, 0, Math.PI, 0);
          ctx.rect(screenX - 8, this.y - 18, 16, 18); // Рубка
          ctx.moveTo(screenX, this.y - 18); ctx.lineTo(screenX, this.y - 25); // Перископ
        } 
        else if (this.type === 'destroyer') {
          // Эсминец
          ctx.moveTo(screenX - this.width/2, this.y);
          ctx.lineTo(screenX + this.width/2, this.y);
          if (this.direction === 1) ctx.lineTo(screenX + this.width/2 - 20, this.y - 12);
          else ctx.lineTo(screenX - this.width/2 + 20, this.y - 12);
          ctx.lineTo(screenX - (this.width/2 - 20) * this.direction, this.y - 12);
          
          ctx.rect(screenX - 25, this.y - 25, 40, 13); // Рубка
          ctx.moveTo(screenX - 5, this.y - 25); ctx.lineTo(screenX - 5, this.y - 45); // Мачта
          ctx.rect(screenX + 25 * this.direction, this.y - 18, 15, 6); // Пушка
        }
        else if (this.type === 'battleship') {
          // Линкор
          ctx.moveTo(screenX - this.width/2, this.y);
          ctx.lineTo(screenX + this.width/2, this.y);
          if (this.direction === 1) ctx.lineTo(screenX + this.width/2 - 30, this.y - 18);
          else ctx.lineTo(screenX - this.width/2 + 30, this.y - 18);
          ctx.lineTo(screenX - (this.width/2 - 30) * this.direction, this.y - 18);
          
          // Большая надстройка
          ctx.rect(screenX - 40, this.y - 35, 70, 17); 
          ctx.rect(screenX - 20, this.y - 50, 30, 15);
          
          // Трубы
          ctx.rect(screenX + 5, this.y - 65, 8, 15);
          
          // Башни ГК
          ctx.rect(screenX + 45 * this.direction, this.y - 24, 25, 10);
          ctx.rect(screenX - 60 * this.direction, this.y - 24, 25, 10);
        }

        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        ctx.shadowBlur = 0; // Отключаем свечение для других объектов
      }
    }

    class Torpedo {
      constructor() {
        this.x = cameraX; 
        this.y = h;
        this.speedY = 5;
        this.size = 12;
        this.active = true;
      }
      update() {
        this.y -= this.speedY;
        this.size = Math.max(2, this.size - 0.08);
        
        if (this.y <= HORIZON_Y + 5) {
          this.checkCollision();
          this.active = false;
          activeTorpedo = null;
        }
      }
      checkCollision() {
        let hit = false;
        ships.forEach(ship => {
          if (ship.active && Math.abs(this.x - ship.x) < ship.width / 2) {
            ship.active = false;
            hit = true;
            score += ship.points;
            document.getElementById('scoreDisplay').innerText = `ОЧКИ: ${score}`;
            sound.play('boom');
            explosions.push({ x: ship.x, y: ship.y, radius: 10, life: 1.0 });
          }
        });
        if (!hit) {
          explosions.push({ x: this.x, y: HORIZON_Y, radius: 5, life: 0.5, splash: true });
        }
      }
      draw() {
        const screenX = this.x - cameraX + w/2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00ff41';
        ctx.fillStyle = '#00ff41';
        
        ctx.beginPath();
        ctx.arc(screenX, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        
        // Кильватер
        ctx.strokeStyle = 'rgba(0, 255, 65, 0.4)';
        ctx.lineWidth = this.size;
        ctx.beginPath();
        ctx.moveTo(screenX, this.y + this.size);
        ctx.lineTo(screenX, this.y + this.size + 40);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    }

    function startGame() {
      resize();
      sound.init();
      document.getElementById('startOverlay').style.display = 'none';
      score = 0; torpedoes = 10; cameraX = 1500;
      ships = []; explosions = []; activeTorpedo = null;
      state = 'playing';
      updateUI();
      gameLoop();
    }

    function updateUI() {
      document.getElementById('scoreDisplay').innerText = `ОЧКИ: ${score}`;
      document.getElementById('torpedoDisplay').innerText = `ТОРПЕДЫ: ${torpedoes}`;
    }

    function fire() {
      if (state !== 'playing' || activeTorpedo || torpedoes <= 0) return;
      torpedoes--;
      updateUI();
      sound.play('launch');
      activeTorpedo = new Torpedo();
      
      // Анимация кнопки
      document.getElementById('btnFire').classList.add('active-btn');
      setTimeout(()=> document.getElementById('btnFire').classList.remove('active-btn'), 200);

      if (torpedoes <= 0) {
        setTimeout(() => {
          state = 'gameover';
          document.getElementById('startOverlay').style.display = 'flex';
          document.getElementById('startOverlay').innerHTML = `
            <h1>ИГРА ОКОНЧЕНА<br><br><span style="font-size:1.5rem; color:#ffaa00">ОЧКИ: ${score}</span></h1>
            <button class="start-btn" onclick="startGame()">СЫГРАТЬ ЕЩЕ</button>
          `;
        }, 2500); 
      }
    }

    // --- УПРАВЛЕНИЕ ---
    const btnL = document.getElementById('btnLeft');
    const btnR = document.getElementById('btnRight');
    const btnF = document.getElementById('btnFire');

    btnL.addEventListener('pointerdown', () => { turnSpeed = -4; btnL.classList.add('active-btn'); });
    btnL.addEventListener('pointerup', () => { turnSpeed = 0; btnL.classList.remove('active-btn'); });
    btnL.addEventListener('pointerleave', () => { turnSpeed = 0; btnL.classList.remove('active-btn'); });
    
    btnR.addEventListener('pointerdown', () => { turnSpeed = 4; btnR.classList.add('active-btn'); });
    btnR.addEventListener('pointerup', () => { turnSpeed = 0; btnR.classList.remove('active-btn'); });
    btnR.addEventListener('pointerleave', () => { turnSpeed = 0; btnR.classList.remove('active-btn'); });
    
    btnF.addEventListener('pointerdown', fire);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') { turnSpeed = -4; btnL.classList.add('active-btn'); }
      if (e.key === 'ArrowRight' || e.key === 'd') { turnSpeed = 4; btnR.classList.add('active-btn'); }
      if (e.key === ' ' || e.key === 'Enter') fire();
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') { turnSpeed = 0; btnL.classList.remove('active-btn'); }
      if (e.key === 'ArrowRight' || e.key === 'd') { turnSpeed = 0; btnR.classList.remove('active-btn'); }
    });

    // Вспомогательная функция зацикливания координат
    function wrap(val, max) { return ((val % max) + max) % max; }

    function gameLoop() {
      if (state !== 'playing' && !activeTorpedo && explosions.length === 0) return;
      requestAnimationFrame(gameLoop);
      
      cameraX += turnSpeed;
      if (turnSpeed !== 0 && Math.random() > 0.8) sound.play('motor'); 

      if (Math.random() < 0.015 && ships.length < 4) ships.push(new Ship());

      ships.forEach(s => s.update());
      ships = ships.filter(s => s.active);
      if (activeTorpedo) activeTorpedo.update();

      // ОТРИСОВКА МИРА
      // 1. Небо
      let skyGrad = ctx.createLinearGradient(0, 0, 0, HORIZON_Y);
      skyGrad.addColorStop(0, '#01050a'); skyGrad.addColorStop(1, '#021526');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, HORIZON_Y);

      // 2. Звезды (медленный параллакс)
      ctx.fillStyle = 'rgba(0, 255, 65, 0.4)';
      stars.forEach(s => {
        let sx = wrap(s.x - cameraX * 0.1, 3000);
        if (sx < w) { ctx.beginPath(); ctx.arc(sx, s.y, s.size, 0, Math.PI*2); ctx.fill(); }
      });

      // 3. Горы на горизонте (средний параллакс)
      ctx.fillStyle = '#010a14';
      ctx.strokeStyle = 'rgba(0, 255, 65, 0.3)';
      ctx.lineWidth = 1;
      mountains.forEach(m => {
        let mx = wrap(m.x - cameraX * 0.3, 3000);
        if (mx < w + 300 && mx > -300) {
          ctx.beginPath();
          ctx.moveTo(mx, HORIZON_Y);
          ctx.lineTo(mx + m.w/2, HORIZON_Y - m.h);
          ctx.lineTo(mx + m.w, HORIZON_Y);
          ctx.fill(); ctx.stroke();
        }
      });

      // 4. Море
      let seaGrad = ctx.createLinearGradient(0, HORIZON_Y, 0, h);
      seaGrad.addColorStop(0, '#001a11'); seaGrad.addColorStop(1, '#000502');
      ctx.fillStyle = seaGrad;
      ctx.fillRect(0, HORIZON_Y, w, h - HORIZON_Y);

      // Линия горизонта
      ctx.strokeStyle = 'rgba(0, 255, 65, 0.8)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, HORIZON_Y); ctx.lineTo(w, HORIZON_Y); ctx.stroke();

      // Отрисовка кораблей
      ships.forEach(s => s.draw());
      if (activeTorpedo) activeTorpedo.draw();

      // Отрисовка взрывов
      explosions.forEach(exp => {
        const screenX = exp.x - cameraX + w/2;
        ctx.beginPath();
        ctx.arc(screenX, exp.y, exp.radius, 0, Math.PI * 2);
        
        if (exp.splash) {
          ctx.fillStyle = `rgba(0, 255, 65, ${exp.life})`; // Водяной столб зеленый
        } else {
          ctx.fillStyle = `rgba(255, 60, 0, ${exp.life})`; // Огонь красный
          ctx.shadowBlur = 20; ctx.shadowColor = '#ff3c00';
        }
        
        ctx.fill();
        ctx.shadowBlur = 0;
        
        exp.radius += exp.splash ? 0.5 : 1.5;
        exp.life -= 0.03;
      });
      explosions = explosions.filter(e => e.life > 0);
    }
  </script>
</body>
</html>
